name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Go Backend Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ./kap-app-backend/go.sum

      - name: Get dependencies
        working-directory: ./kap-app-backend
        run: go mod download

      - name: Run Go Vet
        working-directory: ./kap-app-backend
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        working-directory: ./kap-app-backend
        run: go test -v -race ./...

  frontend-tests:
    name: Flutter Frontend Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: ./kap-app-front
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: ./kap-app-front
        run: flutter analyze

      - name: Run Flutter Unit Tests
        working-directory: ./kap-app-front
        run: flutter test --reporter compact

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./kap-app-front/package-lock.json

      - name: Install Dependencies
        working-directory: ./kap-app-front
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./kap-app-front
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./kap-app-front
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npx playwright test
        continue-on-error: true
