# ============================================================
# KAP-APP v2.0 — Render Infrastructure Blueprint Configuration
# ============================================================
services:
  - type: web
    name: kap-app-backend
    env: docker
    dockerContext: ./kap-app-backend
    dockerfilePath: ./kap-app-backend/Dockerfile
    region: frankfurt
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
